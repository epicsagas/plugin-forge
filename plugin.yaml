# Hermes plugin manifest (YAML).
# Spec: https://hermes-agent.nousresearch.com/docs/developer-guide/plugins
# Loaded by `hermes plugins` from ~/.hermes/plugins/<name>/plugin.yaml
name: plugin-forge
version: "0.2.0"
description: "Multi-host plugin manager (Claude Code · Codex · agy · hermes · grok). Scaffold, doctor, install-validate, and publish plugins using the manifest pattern established by toefl-prep and byoh."
author:
  name: YOUR_GITHUB_USER
  url: https://github.com/YOUR_GITHUB_USER
# Hermes discovers bundled skills via ctx.register_skill() in __init__.py;
# this list documents them so forge doctor can verify the bundle.
provides_skills:
  - plugin-forge
