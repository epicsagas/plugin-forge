name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compile check
        run: python3 -m py_compile scripts/forge.py scripts/i18n_translate.py
      - name: doctor smoke matrix
        run: bash scripts/smoke.sh
      - name: doctor self-check (version + manifest consistency)
        run: python3 scripts/forge.py doctor .
