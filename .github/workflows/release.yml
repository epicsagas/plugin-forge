name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v hdr="## [$ver]" \
            'index($0, hdr) == 1 {f=1; next} f && /^## / {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}"
